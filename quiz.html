<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>문제 풀이 - 소이의 공부방</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quiz-enhanced.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff85a2" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="소이의 공부방" />

  <!-- 공통 스크립트 (순서 + defer) -->
  <script src="/js/config.js" defer></script>
  <script src="/js/core-auth-store.js" defer></script>
  <script src="/js/api-shim.js" defer></script>
  <script src="/js/soi-store.js" defer></script>
  <script src="/js/header.js" defer></script>
  <script src="/js/load-header.js" defer></script>
  <script src="/js/logout.js" defer></script>
  <script src="/js/pwa.js" defer></script>

  <!-- 문제 로딩/보상/연출 -->
  <script src="/js/sheets.js" defer></script>
  <script src="/js/rewards.js?v=RW1" defer></script>
  <script src="/js/drop.js" defer></script>

  <!-- 퀴즈 로직 (맨 뒤) -->
  <script src="/js/quiz.js?v=QZ1" defer></script>
  <script src="/js/quiz-ui.js" defer></script>
</head>

<body>
  <!-- 헤더 -->
  <div id="header-placeholder"></div>

  <!-- 본문 -->
  <main class="container quiz-container">
    <header class="quiz-header">
      <h1>🧠 문제 쑥쑥!</h1>
      <div id="timer-display" class="mini">∞</div>
    </header>

    <section class="quiz-layout">
      <!-- 지문 영역(지문형일 때만 JS가 표시) -->
      <aside class="passage-area" style="display:none">
        <h2>📜 지문</h2>
        <div id="passage-content"></div>
      </aside>

      <!-- 문제 영역 -->
      <section class="problem-area">
        <div class="progress-bar" aria-hidden="true">
          <div class="progress" style="width:0%"></div>
        </div>
        <div class="question-number">
          <span id="current-question">1</span> / <span id="total-questions">10</span>
        </div>

        <div class="question-box card">
          <img id="question-image" alt="문제 이미지" style="display:none" />
          <p class="question-text">문제를 불러오는 중입니다...</p>
        </div>

        <div class="answer-options" role="group" aria-label="선택지">
          <button class="option" data-idx="1">1) 선택지를 불러오는 중입니다...</button>
          <button class="option" data-idx="2">2) 선택지를 불러오는 중입니다...</button>
          <button class="option" data-idx="3">3) 선택지를 불러오는 중입니다...</button>
          <button class="option" data-idx="4">4) 선택지를 불러오는 중입니다...</button>
        </div>
      </section>
    </section>

    <!-- 결과 화면 -->
    <section id="results-container" class="results-card" style="display:none">
      <div class="results-header">
        <div class="results-icon">✨</div>
        <h2>퀴즈 완료!</h2>
        <div class="results-subtitle">수고하셨어요!</div>
      </div>

      <div class="results-content">
        <div class="score-display">
          <div class="score-circle">
            <div class="score-number" id="score-text">0/10</div>
            <div class="score-label">정답</div>
          </div>
        </div>

        <div class="result-message" id="message-text"></div>

        <div class="result-buttons">
          <button id="review-button" class="btn btn-primary" disabled>
            <span class="btn-icon">📚</span>
            오답 복습하기
          </button>
          <a href="index.html" id="main-menu-button" class="btn btn-secondary">
            <span class="btn-icon">🏠</span>
            메인으로
          </a>
        </div>
      </div>
    </section>

    <!-- 정답/오답 토스트 -->
    <div id="toast-message"></div>
  </main>

  <footer class="main-footer">
    <p>&copy; 2025 소이를 위한 아빠의 선물</p>
  </footer>

</body>

</html>
