<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - 소이의 공부방</title>

  <!-- 폰트 / 기본 스타일 -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages-v4.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff85a2" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="소이의 공부방" />
  <script src="/js/pwa.js" defer></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .logo a {
      font-family: 'Jua', sans-serif;
      font-size: 28px;
      color: var(--text);
      text-decoration: none;
    }

    .login-title {
      text-align: center;
      font-size: 22px;
      margin: 0 0 4px;
    }

    .login-sub {
      text-align: center;
      margin: 0 0 20px;
    }

    .card {
      background: var(--white);
      border: var(--border-bold);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-lg);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: 800;
      font-size: 14px;
      color: var(--text);
    }

    input[type=text] {
      flex: 1;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .actions .btn {
      flex: 1;
    }

    footer.mini {
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <main class="wrap" role="main">
    <!-- 좌측 고정 대제목 스타일과 톤을 맞춘 로고 -->
    <div class="logo">
      <a href="index.html" aria-label="메인으로">🎨 소이의 공부방</a>
    </div>

    <h1 class="login-title jua">로그인</h1>
    <p class="mini login-sub">이름을 입력하고 시작하세요.</p>

    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title" class="mini" style="margin:0 0 12px;">사용자 정보</h2>

      <div class="row" style="width:100%;">
        <label for="login-name">이름</label>
        <input id="login-name" type="text" placeholder="예: 소이" inputmode="text" autocomplete="username"
          aria-label="사용자 이름" maxlength="20" required />
      </div>

      <div class="actions">
        <button id="btn-login" class="btn btn-primary">시작하기 →</button>
      </div>

      <p class="mini" style="margin-top:12px;">* 한글/영문/숫자/공백만 허용, 최대 20자</p>
    </section>

    <footer class="mini">&copy; 2026 소이를 위한 세상에서 가장 특별한 공부방 💖</footer>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || 'index.html';
      const input = document.getElementById('login-name');
      const btn = document.getElementById('btn-login');

      // 이미 로그인 상태면 바로 이동
      try {
        const u = (localStorage.getItem('currentUser') || '').trim();
        if (u) {
          location.replace(next);
          return;
        }
      } catch (_) { }

      // 자동 포커스
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => input && input.focus(), { once: true });
      } else if (input) {
        input.focus();
      }

      // 허용 문자: 한글/영문/숫자/공백
      function normalizeName(raw) {
        const cleaned = String(raw).replace(/[^0-9A-Za-z가-힣\s]/g, '');
        return cleaned.replace(/\s+/g, ' ').trim().slice(0, 20);
      }

      function ensureStudyDataFor(name) {
        let sd = {};
        try { sd = JSON.parse(localStorage.getItem('studyData') || '{}') || {}; } catch { }
        if (!sd[name]) sd[name] = { incorrect: [], records: [] };
        localStorage.setItem('studyData', JSON.stringify(sd));
      }

      function saveAndGo(name) {
        localStorage.setItem('currentUser', name);
        ensureStudyDataFor(name);
        window.dispatchEvent(new Event('user:changed')); // 헤더/뱃지 동기화 신호
        location.href = next;
      }

      btn.addEventListener('click', () => {
        const norm = normalizeName(input.value);
        if (!norm) { alert('이름을 입력해주세요.'); input.focus(); return; }
        saveAndGo(norm);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          btn.click();
        }
      });
    })();
  </script>
</body>

</html>
