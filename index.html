<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소이의 공부방 v3 Premium</title>

  <!-- 폰트 / 공통 스타일 -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ui-enhanced.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff85a2" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="소이의 공부방" />

  <!-- 프리미엄 레이아웃 전용 폰트 (Pretendard) -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 공통 스크립트 (defer 순서 고정) -->
  <script src="/js/config.js" defer></script>
  <script src="/js/core-auth-store.js" defer></script>
  <script src="/js/api-shim.js" defer></script>
  <script src="/js/soi-store.js" defer></script>
  <script src="/js/header.js" defer></script>
  <script src="/js/load-header.js" defer></script>
  <script src="/js/logout.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</head>

<body>
  <!-- 헤더 (동적 로드) -->
  <div id="header-placeholder"></div>

  <main class="container">
    <!-- Premium Hero Section (v3) -->
    <section class="welcome-hero-v3">
      <div class="hero-main-flex">
        <div class="hero-text-wrap">
          <h1 class="hero-title">안녕, <span id="user-display-name">소이</span>야! ✨</h1>
          <p class="hero-subtitle">오늘도 너의 꿈을 향해 즐겁게 달려볼까?</p>
        </div>
        <div class="hero-visual glass">
          <img src="assets/toca/hero.png" alt="Toca Soi" class="hero-img-v3">
        </div>
      </div>

      <article class="stat-pill glass" data-hover="magnetic">
        <img src="assets/toca/icon-study.png" class="icon" alt="study">
        <div class="content">
          <span class="val" id="today-total">0</span>
          <span class="lab">푼 문제</span>
        </div>
      </article>
      <article class="stat-pill glass" data-hover="magnetic">
        <img src="assets/toca/icon-goal.png" class="icon" alt="goal">
        <div class="content">
          <span class="val" id="today-correct">0</span>
          <span class="lab">정답 수</span>
        </div>
      </article>
      <article class="stat-pill glass-brand" data-hover="magnetic">
        <img src="assets/toca/icon-shop.png" class="icon" alt="shop">
        <div class="content">
          <span class="val" id="total-points">0</span>
          <span class="lab">보유 포인트</span>
        </div>
      </article>
    </section>

    <!-- Workspace Grid -->
    <section class="workspace-grid">
      <!-- Quick Launcher -->
      <div class="launcher-card glass">
        <div class="workspace-header">
          <h2 class="jua">🚀 학습 런처</h2>
          <p class="mini">학년과 과목을 골라 바로 시작해요</p>
        </div>

        <div class="launcher-form">
          <div class="input-set">
            <div class="field">
              <label>GRADE</label>
              <select id="sel-grade" class="v3-select">
                <option value="">학년 선택</option>
              </select>
            </div>
            <div class="field">
              <label>SUBJECT</label>
              <select id="sel-subject" class="v3-select">
                <option value="">과목 선택</option>
              </select>
            </div>
          </div>

          <div style="display:none">
            <input type="number" id="sel-count" value="10">
            <input type="number" id="sel-timer" value="0">
          </div>

          <div class="btn-group-v3">
            <button id="btn-start" class="btn-v3-primary">
              <span>학습 시작</span>
              <span class="arrow">→</span>
            </button>
            <button id="btn-review" class="btn-v3-secondary">오답 복습</button>
          </div>
        </div>
        <div id="home-msg" class="message-area"></div>
      </div>

      <!-- Live Dashboard (Progress Ring) -->
      <div class="progress-card-v3 glass">
        <div class="workspace-header">
          <h2 class="jua">📈 오늘의 진행률</h2>
        </div>

        <div class="v3-progress-wrap">
          <div class="circle-progress-v3">
            <svg viewBox="0 0 100 100">
              <circle class="bg" cx="50" cy="50" r="45"></circle>
              <circle class="fg" cx="50" cy="50" r="45" id="progress-circle"></circle>
            </svg>
            <div class="center-text">
              <span class="percent" id="today-progress">0%</span>
              <span class="count" id="goal-progress">0/10</span>
            </div>
          </div>
          <div class="recent-tag glass">
            <span class="tag-title">최근 학습</span>
            <span id="recent-session" class="tag-val">기록 없음</span>
          </div>
        </div>
      </div>
    </section>

    <section class="premium-drawer-nav">
      <h2 class="jua">🌈 토카 월드 보물 상자</h2>
      <div class="drawer-grid">
        <a href="quiz.html" class="drawer-item color-1 glass">
          <img src="assets/toca/icon-study.png" class="icon" alt="study">
          <div class="text">
            <strong>공부하기</strong>
            <small>문제를 풀어요</small>
          </div>
        </a>
        <a href="report.html" class="drawer-item color-2 glass">
          <img src="assets/toca/icon-report.png" class="icon" alt="report">
          <div class="text">
            <strong>학습 분석</strong>
            <small>나의 실력은?</small>
          </div>
        </a>
        <a href="goal.html" class="drawer-item color-3 glass">
          <img src="assets/toca/icon-goal.png" class="icon" alt="goal">
          <div class="text">
            <strong>나의 약속</strong>
            <small>목표 달성하기</small>
          </div>
        </a>
        <a href="shop.html" class="drawer-item color-4 glass">
          <img src="assets/toca/icon-shop.png" class="icon" alt="shop">
          <div class="text">
            <strong>포인트 상점</strong>
            <small>보상 받기</small>
          </div>
        </a>
        <a href="notes.html" class="drawer-item color-5 glass">
          <img src="assets/toca/icon-notes.png" class="icon" alt="notes">
          <div class="text">
            <strong>오답 백과</strong>
            <small>다시 공부하기</small>
          </div>
        </a>
        <a href="record.html" class="drawer-item color-6 glass">
          <img src="assets/toca/icon-record.png" class="icon" alt="record">
          <div class="text">
            <strong>발자취</strong>
            <small>전체 기록 보기</small>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer class="premium-footer glass">
    <p>&copy; 2026 소이를 위한 세상에서 가장 특별한 공부방 💖</p>
  </footer>

  <!-- 홈 전용 스크립트 -->
  <script src="/js/home.js" defer></script>
</body>

</html>
